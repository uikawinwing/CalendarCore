name: Mobile V3 ST preview bundle

on:
  push:
    branches:
      - feat/mobile-v3-st-preview
    paths-ignore:
      - dist/**

permissions:
  contents: write

jobs:
  preview-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch only
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-v3-st-preview
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Bundle for SillyTavern
        run: pnpm build

      - name: Publish generated bundle to preview branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/calendar-core-sillytavern.js
          if git diff --cached --quiet; then
            echo "Preview bundle unchanged."
            exit 0
          fi
          git commit -m "chore: build mobile V3 ST preview [skip ci]"
          git push origin HEAD:refs/heads/feat/mobile-v3-st-preview
